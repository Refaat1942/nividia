name: fratelanza-office

services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza-office-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-office}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_office}
    volumes:
      - fratelanza_office_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d fratelanza_office"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - fratelanza_office_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fratelanza-office-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-office}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fratelanza_office}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:16360}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ENVIRONMENT: production
    ports:
      - "${BACKEND_PORT:-127.0.0.1:16361}:8000"
    volumes:
      - fratelanza_office_uploads:/app/uploads
      - fratelanza_office_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - fratelanza_office_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:16361}
    container_name: fratelanza-office-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:16360}:3000"
    depends_on:
      - backend
    networks:
      - fratelanza_office_net

  backup:
    image: postgres:16-alpine
    container_name: fratelanza-office-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-office}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-fratelanza_office}
    volumes:
      - fratelanza_office_backups:/backups
      - ./backup-db.sh:/backup-db.sh:ro
    entrypoint: /bin/sh
    command: >
      -c "while true; do
            sh /backup-db.sh >> /backups/backup.log 2>&1 || true;
            sleep 86400;
          done"
    networks:
      - fratelanza_office_net

volumes:
  fratelanza_office_postgres_data:
    name: fratelanza_office_postgres_data
  fratelanza_office_uploads:
    name: fratelanza_office_uploads
  fratelanza_office_backups:
    name: fratelanza_office_backups

networks:
  fratelanza_office_net:
    name: fratelanza_office_net
    driver: bridge
