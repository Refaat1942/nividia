# Fratelanza Office Manager (Nividia)
# NEW nginx site — does not modify existing fratelanza/crm/labmaster configs
#
#   sudo cp deploy/nginx-nividia.fratelanza.com.conf /etc/nginx/sites-available/nividia.fratelanza.com
#   sudo ln -sf /etc/nginx/sites-available/nividia.fratelanza.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream fratelanza_office_frontend {
    server 127.0.0.1:16360;
}

upstream fratelanza_office_backend {
    server 127.0.0.1:16361;
}

server {
    listen 80;
    listen [::]:80;
    server_name nividia.fratelanza.com;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://fratelanza_office_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://fratelanza_office_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://fratelanza_office_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
